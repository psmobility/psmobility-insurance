async function restore(){let s;try{s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){eraseSession();return}if(!s?.refreshToken||!s?.userId)return;refreshToken=s.refreshToken;userId=s.userId;remember=true;$('#loginMessage').textContent='로그인 정보 확인 중…';try{await renewToken();await load();showApp();startPolling()}catch(e){eraseSession();showLogin('자동 로그인 실패 · 이메일과 비밀번호를 다시 입력해 주세요.')}}
async function load(){if(loading)return;loading=true;$('#appMessage').textContent='서버에서 조회 중…';try{await renewToken();const rows=await api('/rest/v1/insurance_workspaces?select=payload,revision,updated_at&owner_id=eq.'+encodeURIComponent(userId),{auth:true});const row=rows[0];if(!row)throw Error('서버 고객 원본이 없습니다. PC에서 서버 원본을 확인하세요.');if(!Array.isArray(row.payload?.customers))throw Error('서버 고객 목록 형식 오류');customers=row.payload.customers.filter(r=>String(r.status||'').replace(/\s/g,'')!=='자체가입');renderList();if(opened){const r=customers.find(c=>String(c.id)===String(opened));if(r)renderDetail(r);else{opened=null;showListPage()}}$('#appMessage').textContent=`조회 완료 · ${customers.length}명 · 서버 갱신 ${row.updated_at?new Date(row.updated_at).toLocaleString('ko-KR'):'시간 미확인'}`;}catch(e){customers=[];view=[];opened=null;$('#list').replaceChildren();$('#detail').replaceChildren();showListPage();$('#count').textContent='데이터 표시 중단';$('#appMessage').textContent='서버 조회 실패 · 고객정보를 표시하지 않습니다: '+e.message;if(/401|403|jwt|refresh.token|invalid.grant|login.*expired/i.test(e.message)){eraseSession();showLogin('인증이 만료되었습니다. 다시 로그인해 주세요.')}}finally{loading=false}}
function ledger(r){const raw=r.contractLedger;if(!raw)return {list:[],error:''};try{if(typeof raw!=='string'||raw.length>100000)throw Error('원장 형식/크기 오류');const a=JSON.parse(raw);if(!Array.isArray(a)||a.length>100)throw Error('계약 수 오류');const ids=new Set();for(const c of a){if(!c||!c.id||ids.has(c.id)||!dateValid(c.start)||!dateValid(c.expiry)||c.expiry<=c.start||typeof c.previousId!=='string'||typeof c.company!=='string')throw Error('계약 ID·날짜·보험사 오류');ids.add(c.id)}for(const c of a){if(c.previousId&&!ids.has(c.previousId))throw Error('선행 계약 누락')}return {list:a,error:''}}catch(e){return {list:[],error:'독립 계약 원장을 확인할 수 없습니다: '+e.message}}}
function model(r){const l=ledger(r);if(l.error)return {r,contracts:[],leaf:null,error:l.error};if(l.list.length){const parents=new Set(l.list.map(c=>c.previousId).filter(Boolean));const leafs=l.list.filter(c=>!parents.has(c.id));if(leafs.length!==1)return {r,contracts:l.list,leaf:null,error:'연결된 최신 계약이 1건이 아닙니다. PC에서 확인하세요.'};return {r,contracts:l.list,leaf:leafs[0],error:''};}return {r,contracts:[],leaf:null,error:''}}
function latest(r){const m=model(r);if(m.leaf)return {expiry:m.leaf.expiry,number:'A'+m.contracts.indexOf(m.leaf)+1,status:'갱신 예정',error:m.error};if(m.error)return {expiry:r.expiry||'확인 필요',number:'원장 확인 필요',status:'점검 필요',error:m.error};return {expiry:r.expiry||'미등록',number:'현재 계약',status:r.status||'미접촉',error:''}}
function renderList(){const q=$('#search').value.trim().toLowerCase();view=customers.filter(r=>[r.name,r.phone,r.plate,r.brand,r.car].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(latest(a).expiry).localeCompare(String(latest(b).expiry)));$('#count').textContent=`고객 ${customers.length}명 · 검색 ${view.length}명`;
$('#list').innerHTML=view.length?view.map((r,i)=>{const n=latest(r);return `<div class="customer-card"><button class="customer-btn" data-open="${i}"><div class="flex"><div class="customer-name">${esc(r.name||'이름 없음')}</div><span class="tag ${n.error?'warn':''}">${esc(n.number)} · ${esc(n.status)}</span></div><div class="vehicle">${esc([r.brand,r.car].filter(Boolean).join(' · ')||'차량 정보 없음')} · ${esc(r.plate||'차량번호 없음')}</div><div class="flex"><div><div class="tiny">다음 관리 만기일</div><div class="date">${esc(n.expiry)}</div></div><span class="arrow">›</span></div>${n.error?'<div class="warning">독립 원장 확인 필요 · PC에서 점검해 주세요.</div>':''}</button></div>`}).join(''):'<div class="section empty">검색 결과가 없습니다.</div>';
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=view[Number(b.dataset.open)];opened=r.id;selectedContract=null;renderDetail(r);$('#listPage').classList.add('hidden');$('#detailPage').classList.remove('hidden');history.pushState({psmobility:'detail'},'',psmBaseUrl()+'#psm-detail');window.scrollTo(0,0)})}
function showListPage(){$('#detailPage').classList.add('hidden');$('#listPage').classList.remove('hidden');window.scrollTo(0,0)}
function pair(k,v,copyKey=''){return `<div class="kv"><small>${esc(k)}</small><strong class="${copyKey?'copy-value':''}">${esc(v==null||v===''?'—':v)}${copyKey&&v?`<button type="button" class="copy-btn" data-copy="${copyKey}" aria-label="${esc(k)} 복사">복사</button>`:''}</strong></div>`}
function renderDetail(r){const m=model(r),cs=m.contracts,parents=new Set(cs.map(x=>x.previousId).filter(Boolean));const effective=cs.length?cs:[{id:'legacy',previousId:'',start:r.start,expiry:r.expiry,joinDate:r.joinDate,premium:r.premium,company:r.company,driver:r.driver,age:r.age}];const curr=selectedContract&&effective.find(x=>x.id===selectedContract)||m.leaf||effective[effective.length-1];selectedContract=curr.id;const hotline=INSURERS[curr.company]||'';
const buttons=effective.map((c,i)=>{const done=parents.has(c.id),unknown=m.error;return `<button class="contract-btn ${curr.id===c.id?'selected':''}" data-contract="${i}"><span class="ball ${done?'':'next'} ${unknown?'alert':''}">${done?'완':unknown?'!':'A'+(i+1)}</span><span class="contract-info"><span class="flex"><span class="contract-title">${cs.length?'A'+(i+1):'현재 저장 계약'} ${done?'· 갱신 완료':c.id===m.leaf?.id?'· 다음 갱신 예정':''}</span></span><span class="contract-meta">만기 ${esc(c.expiry||'확인 필요')} · ${esc(c.company||'보험사 미등록')}</span></span><span class="arrow">›</span></button>`}).join('');
$('#detail').innerHTML=`<div class="section"><div class="flex"><div><div class="customer-name">${esc(r.name||'이름 없음')}</div><div class="vehicle">${esc([r.brand,r.car,r.plate].filter(Boolean).join(' · ')||'차량 정보 없음')}</div></div><span class="tag">조회 전용</span></div>${pair('연락처',r.phone,'customerPhone')}</div><div class="section"><h2>보험계약 이력</h2>${m.error?`<div class="warning">${esc(m.error)} · 잘못된 원장을 임의로 대체하거나 계약을 추정하지 않습니다.</div>`:''}${buttons}<div class="hint">원형 ‘완’은 확정된 후속 계약이 연결된 계약만 표시합니다. 독립 원장이 없는 기존 고객은 현재 계약만 표시합니다.</div></div><div class="section"><h2>${cs.length?'A'+(effective.indexOf(curr)+1):'현재 계약'} 상세 정보</h2>${pair('보험사',curr.company)}${hotline?pair('보험사 대표 콜센터',hotline,'insurerPhone'):''}${pair('보험기간',(curr.start||'—')+' ~ '+(curr.expiry||'—'))}${pair('가입일',curr.joinDate)}${pair('보험료',money(curr.premium))}${pair('운전자 범위',curr.driver)}${pair('최저 운전자 연령',curr.age)}${pair('마일리지 환급금',curr.refund===''||curr.refund==null?'기록 없음':money(curr.refund))}${pair('최종 결제금액',curr.final===''||curr.final==null?'기록 없음':money(curr.final))}${!cs.length?'<div class="hint">기존 고객의 과거 계약은 추정해서 추가하지 않았습니다.</div>':''}</div>`;
document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=()=>{selectedContract=effective[Number(b.dataset.contract)].id;renderDetail(r)});
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const insurer=b.dataset.copy==='insurerPhone';copyDisplayedNumber(insurer?[curr.company,hotline].filter(Boolean).join('  '):r.phone,insurer?'보험사명과 연락처가 복사되었습니다':'고객 연락처가 복사되었습니다');});}
async function copyDisplayedNumber(value,successMessage='연락처가 복사되었습니다'){if(!value)return;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(String(value));}else{const el=document.createElement('textarea');el.value=String(value);el.style.cssText='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('복사 불가');el.remove();}const toast=$('#copyToast');toast.textContent=successMessage;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1700);}catch(e){window.prompt('아래 번호를 길게 눌러 복사하세요',String(value));}}

async function logout(){const old=token;eraseSession();showLogin('로그아웃했습니다.');if(old)fetch(URL_BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:PUBLIC_KEY,Authorization:'Bearer '+old}}).catch(()=>{});}
function startPolling(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)load()},60000)}
// Use distinct same-document history entries for reliable Android PWA Back handling.
// Never navigate to about:blank or another origin to simulate an app exit.
let navigationInitialized=false;
const psmBaseUrl=()=>location.pathname+location.search;
function initializeAppHistory(){
  if(!navigationInitialized){
    navigationInitialized=true;
    history.replaceState({psmobility:'root'},'',psmBaseUrl()+'#psm-root');
    history.pushState({psmobility:'list'},'',psmBaseUrl()+'#psm-list');
  }else if(history.state?.psmobility!=='list' && history.state?.psmobility!=='detail'){
    history.pushState({psmobility:'list'},'',psmBaseUrl()+'#psm-list');
  }
}
function returnToList(){opened=null;selectedContract=null;showListPage();}
function psmRearmList(){
  // Replace a consumed list entry, ensuring another back press reaches the confirmation.
  history.pushState({psmobility:'list'},'',psmBaseUrl()+'#psm-list');
}
window.addEventListener('popstate',()=>{
  if($('#app').classList.contains('hidden'))return;
  if(opened){returnToList();return;}
  const wantsExit=window.confirm('평생 보험관리 앱을 종료하시겠습니까?');
  if(!wantsExit){psmRearmList();return;}
  // Web apps cannot reliably close the native Android activity themselves.
  // Request close; if denied, keep a valid app screen rather than navigating to a blank page.
  window.close();
  if(!document.hidden){
    psmRearmList();
    const t=$('#copyToast');
    t.textContent='안드로이드에서 자동 종료를 허용하지 않습니다. 홈 버튼이나 최근 앱에서 닫아주세요.';
    t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4000);
  }
});
window.addEventListener('pageshow',()=>{
  // Recreate the in-app list history entry after Android restores an old app activity.
  if(!$('#app').classList.contains('hidden')&&!opened&&history.state?.psmobility!=='list'){
    psmRearmList();
  }
});
$('#loginForm').addEventListener('submit',signIn);$('#logout').onclick=logout;$('#refresh').onclick=load;$('#back').onclick=()=>{if(history.state?.psmobility==='detail')history.back();else returnToList()};$('#search').addEventListener('input',renderList);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&userId)load()});restore();

   // Only reload when not editing anything, this is a read-only app.

 }catch(e){}finally{psmUpdateBusy=false;}
